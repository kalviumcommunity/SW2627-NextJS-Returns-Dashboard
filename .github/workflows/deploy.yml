name: Deploy Returns Dashboard to GCP

# Keeps the latest code deployed on GCP Cloud Run: on every push to main we
# build the Docker image, push it to Artifact Registry, run any pending
# Prisma migrations against Cloud SQL (Postgres), then deploy the new
# revision. Also runs on a schedule to hit the auto-approve endpoint as a
# belt-and-braces SLA sweep even if the app is idle.

on:
  push:
    branches: [main]

  schedule:
    - cron: "*/15 * * * *" # SLA sweep every 15 minutes

  workflow_dispatch: {}

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE_NAME: returns-dashboard
  IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/returns-dashboard/app

jobs:
  deploy:
    if: github.event_name != 'schedule'

    runs-on: ubuntu-latest

    # Required for GitHub OIDC authentication
    permissions:
      contents: read
      id-token: write

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate GitHub Actions with Google Cloud using Workload Identity Federation
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Install/configure gcloud
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # Configure Docker to authenticate with Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            ${{ secrets.GCP_REGION }}-docker.pkg.dev \
            --quiet

      # Build Docker image
      - name: Build image
        run: |
          docker build \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            .

      # Push Docker image to Artifact Registry
      - name: Push image
        run: |
          docker push $IMAGE --all-tags

      # Run Prisma migrations as a one-off Cloud Run Job instead of `docker run`
      # on this GitHub-hosted runner. The old approach passed DATABASE_URL via
      # `docker run -e DATABASE_URL=...`, which puts the raw secret into the
      # process's argument list (visible to anything on the runner that can
      # read `ps aux` while the container starts, and into shell/audit logs
      # on self-hosted runners). Running it as a Cloud Run Job with
      # `--set-secrets` instead means Google's infrastructure injects the
      # value straight from Secret Manager into the job's environment —
      # the plaintext connection string never exists on this runner at all.
      - name: Run Prisma migrations (Cloud Run Job)
        run: |
          gcloud run jobs deploy migrate-db \
            --image="$IMAGE:${{ github.sha }}" \
            --region="$REGION" \
            --command="npx" \
            --args="prisma,migrate,deploy" \
            --set-secrets="DATABASE_URL=${{ secrets.DATABASE_URL_SECRET_NAME }}:latest" \
            --max-retries=0 \
            --quiet

          gcloud run jobs execute migrate-db --region="$REGION" --wait

      # Deploy Docker image to Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}

          env_vars: |
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            CRON_SECRET=${{ secrets.CRON_SECRET }}

          secrets: |
            DATABASE_URL=${{ secrets.DATABASE_URL_SECRET_NAME }}:latest

  # Scheduled SLA sweep
  sla-sweep:
    if: github.event_name == 'schedule'

    runs-on: ubuntu-latest

    steps:
      - name: Hit auto-approve endpoint
        run: |
          curl -sf -X POST \
            "${{ secrets.APP_URL }}/api/returns/auto-approve" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

name: Deploy Returns Dashboard to GCP

# Deploys the latest code to GCP Cloud Run whenever main is updated.
# Also runs the auto-approve SLA sweep every 15 minutes.

on:
  push:
    branches: [main]

  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch: {}

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE_NAME: returns-dashboard
  IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/returns-dashboard/app

jobs:
  # ============================================================
  # BUILD + MIGRATE + DEPLOY
  # ============================================================
  deploy:
    # Do not run this job for scheduled executions.
    if: github.event_name != 'schedule'

    runs-on: ubuntu-latest

    # Prevent two deployments from running at the same time.
    concurrency:
      group: returns-dashboard-deploy
      cancel-in-progress: false

    timeout-minutes: 20

    # Required for GitHub OIDC authentication with GCP.
    permissions:
      contents: read
      id-token: write

    steps:
      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Authenticate GitHub Actions with Google Cloud
      # using Workload Identity Federation
      # ----------------------------------------------------------
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # ----------------------------------------------------------
      # Install/configure gcloud
      # ----------------------------------------------------------
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # ----------------------------------------------------------
      # Configure Docker authentication for Artifact Registry
      # ----------------------------------------------------------
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            ${{ secrets.GCP_REGION }}-docker.pkg.dev \
            --quiet

      # ----------------------------------------------------------
      # Build Docker image
      # ----------------------------------------------------------
      - name: Build image
        run: |
          docker build \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            .

      # ----------------------------------------------------------
      # Push Docker image to Artifact Registry
      # ----------------------------------------------------------
      - name: Push image
        run: |
          docker push $IMAGE --all-tags

      # ----------------------------------------------------------
      # Run Prisma migrations against Cloud SQL
      # ----------------------------------------------------------
      - name: Run Prisma migrations
        run: |
          docker run --rm \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            $IMAGE:${{ github.sha }} \
            npx prisma migrate deploy

      # ----------------------------------------------------------
      # Deploy image to Cloud Run
      # ----------------------------------------------------------
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}

          # AUTH_SECRET and CRON_SECRET are passed to Cloud Run
          # from GitHub Actions secrets.
          env_vars: |
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            CRON_SECRET=${{ secrets.CRON_SECRET }}

          # DATABASE_URL is stored in GCP Secret Manager.
          secrets: |
            DATABASE_URL=${{ secrets.DATABASE_URL_SECRET_NAME }}:latest

  # ============================================================
  # SCHEDULED SLA SWEEP
  # ============================================================
  sla-sweep:
    # Only run this job when GitHub Actions was triggered
    # by the 15-minute schedule.
    if: github.event_name == 'schedule'

    runs-on: ubuntu-latest

    timeout-minutes: 5

    # This job only makes an HTTP request.
    # It does not need GitHub repository permissions.
    permissions: {}

    steps:
      - name: Hit auto-approve endpoint
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30 \
            -X POST \
            "${{ secrets.APP_URL }}/api/returns/auto-approve" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"